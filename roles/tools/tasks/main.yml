---
# Update apt cache
- name: Update apt cache
  apt:
    update_cache: yes
    force_apt_get: yes

# Install essential build tools and Python development environment
- name: Install essential build tools and Python development environment
  apt:
    name:
      - build-essential
      - libssl-dev
      - libffi-dev
      - python3-dev
      - python3-pip
      - python3-venv
      - python3.10
    state: present
    force_apt_get: yes

# Install development tools
- name: Install development tools
  apt:
    name:
      - git
      - git-filter-repo
      - golang
      - default-jdk
      - php-dev
      - php-pear
      - composer
    state: present
    force_apt_get: yes
      
# Install system utilities
- name: Install system utilities
  apt:
    name:
      - htop
      - tmux
      - ripgrep
      - xclip
        #    - ffmpeg
        # - postgresql-client
        # - software-properties-common
        # - fuse
    state: present
    force_apt_get: yes

# Install NVM and Node.js versions
- name: Download NVM installer script
  get_url:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh
    dest: /tmp/install-nvm.sh
    mode: '0755'

- name: Run NVM installer script
  shell: bash /tmp/install-nvm.sh
  args:
    executable: /bin/bash
  become_user: "{{ ansible_user_id }}"

- name: Add NVM paths to .zshrc
  lineinfile:
    path: "/home/{{ ansible_user_id }}/.zshrc"
    line: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
    state: present
  become_user: "{{ ansible_user_id }}"

- name: Install Node.js versions
  shell: |
    export NVM_DIR="/home/{{ ansible_user_id }}/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install 16.20.2
    nvm install 18.20.4
    nvm install 20.11.1
    nvm alias default 20.11.1
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user_id }}"
  become_user: "{{ ansible_user_id }}"

# Install Neovim AppImage and dependencies
- name: Create Neovim directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - /opt/nvim
    - "/home/{{ ansible_user_id }}/.config/nvim"

- name: Download Neovim AppImage
  get_url:
    url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.appimage
    dest: /tmp/nvim-linux-x86_64.appimage
    mode: '0755'

- name: Extract Neovim AppImage
  shell: |
    cd /tmp
    ./nvim-linux-x86_64.appimage --appimage-extract
  args:
    executable: /bin/bash

- name: Move Neovim files to system locations
  shell: |
    mv /tmp/squashfs-root /squashfs-root
    ln -sf /squashfs-root/AppRun /usr/bin/nvim
  args:
    executable: /bin/bash

- name: Install Neovim dependencies
  apt:
    name:
      - python3-neovim
    state: present
    force_apt_get: yes

- name: Clone Neovim configuration
  git:
    repo: https://github.com/mdilshan/my-vim-config.git
    dest: "/home/{{ ansible_user_id }}/.config/nvim"
    version: master
    force: yes

- name: Create Packer directory
  file:
    path: "/home/{{ ansible_user_id }}/.local/share/nvim/site/pack/packer/start/packer.nvim"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
  become_user: "{{ ansible_user_id }}"

- name: Clone Packer
  git:
    repo: https://github.com/wbthomason/packer.nvim
    dest: "/home/{{ ansible_user_id }}/.local/share/nvim/site/pack/packer/start/packer.nvim"
    version: master
    force: yes
  become_user: "{{ ansible_user_id }}"

- name: Install Neovim plugins
  shell: nvim --headless -c 'autocmd User PackerComplete quitall' -c 'PackerSync'
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user_id }}"
  become_user: "{{ ansible_user_id }}"

# Install Docker
- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
    state: present
    update_cache: yes

- name: Install Docker
  apt:
    name: docker-ce
    state: present
    update_cache: yes
    force_apt_get: yes

- name: Ensure Docker service is started and enabled
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes

# Add Go paths to .zshrc
- name: Ensure Go environment is configured in .zshrc
  lineinfile:
    path: "/home/{{ ansible_user_id }}/.zshrc"
    line: |
      export GOPATH="$HOME/go"
      export PATH="$PATH:/usr/local/go/bin:$GOPATH/bin"
    state: present
  become_user: "{{ ansible_user_id }}"

# Install ngrok
- name: Download ngrok
  get_url:
    url: https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
    dest: /tmp/ngrok.tgz
    mode: '0644'

- name: Extract ngrok
  unarchive:
    src: /tmp/ngrok.tgz
    dest: /usr/local/bin
    remote_src: yes
    mode: '0755'
